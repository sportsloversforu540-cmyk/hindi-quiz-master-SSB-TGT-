<!doctype html>
<html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hindi Quiz Master - संज्ञा</title>
<style>
body{font-family:system-ui,sans-serif;background:#fff8ed;color:#222;padding:16px;max-width:760px;margin:auto}
h1{color:#b45309;text-align:center}.card{background:white;padding:18px;border:1px solid #eadfce;border-radius:16px;margin:12px 0}
.q{padding:14px 0;border-bottom:1px solid #ddd}label{display:block;padding:9px;margin:6px 0;border:1px solid #ddd;border-radius:9px}
button{width:100%;padding:13px;background:#b45309;color:white;border:0;border-radius:10px;font-size:16px;margin-top:14px}
.explain{background:#f3f3f3;padding:9px;margin-top:8px;border-radius:8px}
</style>
<main><div class="card"><h1>हिंदी ज्ञान परीक्षा</h1><p style="text-align:center">विषय: संज्ञा · 15 प्रश्न · 15 अंक</p></div>
<div class="card"><p id="progress">0/15 उत्तर दिए</p><form id="quiz"></form><button id="submit" disabled>उत्तर जमा करें</button><h2 id="result"></h2><button id="retry" hidden onclick="location.reload()">फिर से क्विज़ दें</button></div></main>
<script>
const qs=[
["संज्ञा किसे कहते हैं?",["काम के नाम को","किसी व्यक्ति, वस्तु, स्थान या भाव के नाम को","गुण बताने वाले शब्द को","काम बताने वाले शब्द को"],1,"किसी व्यक्ति, वस्तु, स्थान या भाव के नाम को संज्ञा कहते हैं।"],
["'राम' कौन-सी संज्ञा है?",["जातिवाचक","भाववाचक","व्यक्तिवाचक","द्रव्यवाचक"],2,"राम एक विशेष व्यक्ति का नाम है।"],
["'लड़का' कौन-सी संज्ञा है?",["व्यक्तिवाचक","जातिवाचक","भाववाचक","समूहवाचक"],1,"लड़का जाति के व्यक्तियों का बोध कराता है।"],
["'ईमानदारी' कौन-सी संज्ञा है?",["भाववाचक","व्यक्तिवाचक","जातिवाचक","द्रव्यवाचक"],0,"ईमानदारी एक गुण या भाव है।"],
["'गंगा' कौन-सी संज्ञा है?",["जातिवाचक","समूहवाचक","व्यक्तिवाचक","भाववाचक"],2,"गंगा एक विशेष नदी का नाम है।"],
["'सेना' कौन-सी संज्ञा है?",["भाववाचक","समूहवाचक","व्यक्तिवाचक","द्रव्यवाचक"],1,"सेना सैनिकों के समूह का बोध कराती है।"],
["'सोना' (धातु) कौन-सी संज्ञा है?",["व्यक्तिवाचक","भाववाचक","द्रव्यवाचक","समूहवाचक"],2,"सोना एक धातु है।"],
["भाववाचक संज्ञा कौन-सी है?",["किताब","मिठास","दिल्ली","बच्चा"],1,"मिठास एक गुण या भाव है।"],
["'विद्यालय' कौन-सी संज्ञा है?",["जातिवाचक","व्यक्तिवाचक","भाववाचक","समूहवाचक"],0,"विद्यालय एक प्रकार के स्थान का नाम है।"],
["'बचपन' किसका उदाहरण है?",["द्रव्यवाचक","समूहवाचक","भाववाचक","व्यक्तिवाचक"],2,"बचपन जीवन की एक अवस्था है।"],
["'हिमालय' कौन-सी संज्ञा है?",["व्यक्तिवाचक","जातिवाचक","भाववाचक","समूहवाचक"],0,"हिमालय एक विशेष पर्वत श्रृंखला का नाम है।"],
["'कक्षा' (विद्यार्थियों के समूह के अर्थ में) किसका उदाहरण है?",["भाववाचक","समूहवाचक","द्रव्यवाचक","व्यक्तिवाचक"],1,"यहाँ कक्षा विद्यार्थियों के समूह को दर्शाती है।"],
["'दूध' कौन-सी संज्ञा है?",["व्यक्तिवाचक","भाववाचक","द्रव्यवाचक","समूहवाचक"],2,"दूध एक पदार्थ है।"],
["'सुंदरता' कौन-सी संज्ञा है?",["जातिवाचक","भाववाचक","व्यक्तिवाचक","समूहवाचक"],1,"सुंदरता एक गुण का नाम है।"],
["'भारत' कौन-सी संज्ञा है?",["व्यक्तिवाचक","भाववाचक","द्रव्यवाचक","जातिवाचक"],0,"भारत एक विशेष देश का नाम है।"]];
const form=document.getElementById('quiz'),btn=document.getElementById('submit');
qs.forEach((q,i)=>{let s=document.createElement('section');s.className='q';let h=document.createElement('h3');h.textContent=`प्रश्न ${i+1}. ${q[0]}`;s.append(h);q[1].forEach((v,j)=>{let l=document.createElement('label'),r=document.createElement('input');r.type='radio';r.name='q'+i;r.value=j;r.onchange=update;l.append(r,' '+String.fromCharCode(65+j)+'. '+v);s.append(l)});form.append(s)});
function update(){let n=qs.filter((q,i)=>form.querySelector(`[name=q${i}]:checked`)).length;document.getElementById('progress').textContent=n+'/15 उत्तर दिए';btn.disabled=n!==15}
btn.onclick=()=>{let score=0;qs.forEach((q,i)=>{let n=Number(form.querySelector(`[name=q${i}]:checked`).value);if(n===q[2])score++;form.querySelectorAll(`[name=q${i}]`).forEach(x=>x.disabled=true);let e=document.createElement('div');e.className='explain';e.textContent='सही उत्तर: '+q[1][q[2]]+' — '+q[3];form.children[i].append(e)});document.getElementById('result').textContent='आपका स्कोर: '+score+'/15';btn.disabled=true;btn.textContent='जमा हो गया';document.getElementById('retry').hidden=false};
</script></html>
